apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jsw-db
  namespace: ${NAMESPACE}
spec:
  serviceName: jsw-db
  replicas: 1
  selector:
    matchLabels:
      app: jsw-db
  template:
    metadata:
      labels:
        app: jsw-db
    spec:
      containers:
        - name: ${DB_CONTAINER_NAME}
          image: ${DB_IMAGE}
          ports:
            - containerPort: ${DB_PORT}
              name: ${DB_SERVICE_PORT_NAME}
          env:
${DB_ENV_INDENT}
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - ${DB_PROBE_COMMAND}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - ${DB_PROBE_COMMAND}
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: db-data
              mountPath: ${DB_VOLUME_MOUNT_PATH}
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d/init.sql
              subPath: init.sql
      volumes:
        - name: init-sql
          configMap:
            name: jsw-init-sql
  volumeClaimTemplates:
    - metadata:
        name: db-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ${DB_STORAGE_CLASS}
        resources:
          requests:
            storage: ${DB_STORAGE_SIZE}

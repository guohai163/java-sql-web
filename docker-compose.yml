services:
  jsw-db:
    image: pgvector/pgvector:pg18
    container_name: jsw-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-javasqlweb_db}
      POSTGRES_USER: ${DB_USERNAME:-jsw}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-my-secret-pw}
    volumes:
      - jsw-db-data:/var/lib/postgresql
      - ./deploy/init.postgresql.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DB_USERNAME:-jsw} -d ${DB_NAME:-javasqlweb_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

  jsw-server:
    image: ${JSW_SERVER_IMAGE:-ghcr.io/guohai163/java-sql-web-server}:${TAG}
    container_name: jsw-server
    restart: unless-stopped
    depends_on:
      jsw-db:
        condition: service_healthy
    environment:
      DB_HOST: jsw-db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-javasqlweb_db}
      DB_USERNAME: ${DB_USERNAME:-jsw}
      DB_PASSWORD: ${DB_PASSWORD:-my-secret-pw}
      DB_DIALECT: ${DB_DIALECT:-postgresql}
      APP_DB_DIALECT: ${APP_DB_DIALECT:-postgresql}
      DB_URL: ${DB_URL:-jdbc:postgresql://jsw-db:5432/${DB_NAME:-javasqlweb_db}}
      PROJECT_VERSION: ${TAG}
      PROJECT_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
      PROJECT_HOST: ${PUBLIC_HOST:-http://localhost}
      PROJECT_LEGACY_TLS_ENABLED: ${PROJECT_LEGACY_TLS_ENABLED:-false}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:-}
    volumes:
      - ./deploy/java-security/legacy-tls.security:/opt/jsw/legacy-tls.security:ro
    expose:
      - "8002"

  jsw-front:
    image: ${JSW_FRONT_IMAGE:-ghcr.io/guohai163/java-sql-web-front}:${TAG}
    container_name: jsw-front
    restart: unless-stopped
    depends_on:
      - jsw-server
    ports:
      - "${FRONT_PORT:-80}:80"

volumes:
  jsw-db-data:

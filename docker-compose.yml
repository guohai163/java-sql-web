services:
  jsw-db:
    image: pgvector/pgvector:pg18
    container_name: jsw-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-javasqlweb_db}
      POSTGRES_USER: ${DB_USERNAME:-jsw}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-my-secret-pw}
    volumes:
      - jsw-db-data:/var/lib/postgresql
      - ./deploy/init.postgresql.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DB_USERNAME:-jsw} -d ${DB_NAME:-javasqlweb_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

  jsw-server:
    image: ${JSW_SERVER_IMAGE:-ghcr.io/guohai163/java-sql-web-server}:${TAG}
    container_name: jsw-server
    restart: unless-stopped
    depends_on:
      jsw-db:
        condition: service_healthy
    environment:
      DB_HOST: jsw-db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-javasqlweb_db}
      DB_USERNAME: ${DB_USERNAME:-jsw}
      DB_PASSWORD: ${DB_PASSWORD:-my-secret-pw}
      DB_DIALECT: ${DB_DIALECT:-postgresql}
      APP_DB_DIALECT: ${APP_DB_DIALECT:-postgresql}
      DB_URL: ${DB_URL:-jdbc:postgresql://jsw-db:5432/${DB_NAME:-javasqlweb_db}}
      PROJECT_VERSION: ${TAG}
      PROJECT_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
      PROJECT_HOST: ${PUBLIC_HOST:-http://localhost}
      PROJECT_LEGACY_TLS_ENABLED: ${PROJECT_LEGACY_TLS_ENABLED:-false}
      VANNA_INTERNAL_TOKEN: ${VANNA_INTERNAL_TOKEN:-change-me}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:-}
    volumes:
      - ./deploy/java-security/legacy-tls.security:/opt/jsw/legacy-tls.security:ro
    expose:
      - "8002"

  jsw-vanna:
    image: ${JSW_VANNA_IMAGE:-ghcr.io/guohai163/java-sql-web-vanna}:${TAG}
    container_name: jsw-vanna
    restart: unless-stopped
    depends_on:
      jsw-db:
        condition: service_healthy
      jsw-server:
        condition: service_started
    environment:
      PROJECT_VERSION: ${TAG}
      VANNA_PORT: ${VANNA_PORT:-8003}
      JSW_SERVER_BASE_URL: ${JSW_SERVER_BASE_URL:-http://jsw-server:8002}
      VANNA_INTERNAL_TOKEN: ${VANNA_INTERNAL_TOKEN:-change-me}
      VANNA_DB_URL: ${VANNA_DB_URL:-postgresql://${VANNA_DB_USER:-jsw_vanna}:${VANNA_DB_PASSWORD:-change-me}@jsw-db:5432/${VANNA_DB_NAME:-jsw_vanna_db}}
      VANNA_CHAT_MODEL: ${VANNA_CHAT_MODEL:-gpt-5.4-mini}
      VANNA_EMBEDDING_MODEL_SOURCE: ${VANNA_EMBEDDING_MODEL_SOURCE:-huggingface}
      VANNA_EMBEDDING_MODEL: ${VANNA_EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      VANNA_EMBEDDING_MODELSCOPE_MODEL_ID: ${VANNA_EMBEDDING_MODELSCOPE_MODEL_ID:-}
      VANNA_EMBEDDING_MODEL_REVISION: ${VANNA_EMBEDDING_MODEL_REVISION:-}
      VANNA_EMBEDDING_MODEL_CACHE_DIR: ${VANNA_EMBEDDING_MODEL_CACHE_DIR:-}
      VANNA_LLM_BASE_URL: ${VANNA_LLM_BASE_URL:-https://api.openai.com/v1}
      VANNA_LLM_API_KEY: ${VANNA_LLM_API_KEY:-}
    expose:
      - "8003"

  jsw-front:
    image: ${JSW_FRONT_IMAGE:-ghcr.io/guohai163/java-sql-web-front}:${TAG}
    container_name: jsw-front
    restart: unless-stopped
    depends_on:
      - jsw-server
      - jsw-vanna
    ports:
      - "${FRONT_PORT:-80}:80"

volumes:
  jsw-db-data:
